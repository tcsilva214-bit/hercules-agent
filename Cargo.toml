[package]
name = "hercules-agent"
version = "0.1.0"
edition = "2021"
authors = ["The HERCULES authors"]
license = "Apache-2.0"
description = "HERCULES: a local agent harness that runs a model in a bounded, read-only loop and proves what it did (receipts, re-derivable evidence reports)."
repository = "https://github.com/tcsilva214-bit/hercules-agent"
readme = "README.md"

[dependencies]
serde_json = "1"
libc = "0.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[profile.release]
strip = false
